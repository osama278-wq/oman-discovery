<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مستكشف عُمان الجغرافي | Oman Geographic Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   A) LEAFLET CORE CSS (inlined essentials, v1.9 compatible)
   ===================================================================== */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-family:'Cairo',sans-serif}
.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px}
.leaflet-container .leaflet-overlay-pane svg,.leaflet-container .leaflet-marker-pane img{max-width:none!important;max-height:none!important}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-fade-anim .leaflet-popup{opacity:0;transition:opacity .2s linear}.leaflet-fade-anim .leaflet-map-pane .leaflet-popup{opacity:1}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{will-change:transform;transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}
.leaflet-crosshair,.leaflet-crosshair .leaflet-interactive{cursor:crosshair}
.leaflet-popup-pane,.leaflet-control{cursor:auto}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-bar{box-shadow:0 2px 8px rgba(29,53,87,.25);border-radius:10px;overflow:hidden}
.leaflet-bar a{background:#fff;border-bottom:1px solid #e3e3e3;width:36px;height:36px;line-height:36px;display:block;text-align:center;text-decoration:none;color:#1D3557;font:700 20px/36px 'Cairo',sans-serif}
.leaflet-bar a:last-child{border-bottom:none}.leaflet-bar a:hover{background:#f4ede2}
.leaflet-bar a.leaflet-disabled{cursor:default;color:#bbb}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:22px}
.leaflet-popup-content-wrapper{padding:0;text-align:start;border-radius:16px;overflow:hidden}
.leaflet-popup-content{margin:0;line-height:1.5;min-height:1px;width:300px}
.leaflet-popup-tip-container{width:40px;height:20px;position:absolute;left:50%;margin-top:-1px;margin-left:-20px;overflow:hidden;pointer-events:none}
.leaflet-popup-tip{width:17px;height:17px;padding:1px;margin:-10px auto 0;transform:rotate(45deg)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#fff;color:#1d2a3a;box-shadow:0 10px 30px rgba(29,53,87,.3)}
.leaflet-container a.leaflet-popup-close-button{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.85);text-align:center;font:700 18px/28px Tahoma,sans-serif;color:#1D3557;text-decoration:none;z-index:2}
.leaflet-tooltip{position:absolute;padding:4px 10px;background:#1D3557;color:#fff;border-radius:8px;white-space:nowrap;user-select:none;pointer-events:none;font:600 13px 'Cairo',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.leaflet-control-scale-line{border:2px solid #1D3557;border-top:none;line-height:1.1;padding:2px 6px;font:600 11px 'Cairo',sans-serif;white-space:nowrap;box-sizing:border-box;background:rgba(255,255,255,.85);color:#1D3557}
.leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0;padding:0 6px;color:#555;font-size:10px;border-radius:6px 0 0 0}
.leaflet-control-attribution a{color:#457B9D}

/* =====================================================================
   B) DESIGN SYSTEM — Omani landscape palette
   ===================================================================== */
:root{
  --sand:#D4A373; --sand-l:#F3E6D3; --cream:#FBF7F0; --teal:#1D3557; --slate:#457B9D;
  --emerald:#1B9C6B; --gold:#E3B23C; --ink:#1d2a3a; --muted:#5f6f82; --line:#e7dccb;
  --heritage:#B9722E; --nature:#2E9E62; --modern:#1A8FC9;
  --ok:#22A06B; --bad:#D64545;
  --radius:16px; --shadow:0 6px 24px rgba(29,53,87,.12);
  --head-h:66px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:'Cairo',system-ui,sans-serif;color:var(--ink);background:var(--cream)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- Header ---------- */
header{height:var(--head-h);display:flex;align-items:center;gap:14px;padding:0 16px;
  background:linear-gradient(120deg,var(--teal) 0%,#24486e 55%,var(--slate) 100%);color:#fff;position:relative;z-index:1100;
  box-shadow:0 4px 18px rgba(29,53,87,.3)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:42px;height:42px;flex:none}
.brand h1{margin:0;font-size:20px;font-weight:900;line-height:1.1;white-space:nowrap}
.brand small{display:block;font-size:12px;font-weight:600;color:#f6deb8;white-space:nowrap}
.head-stats{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.stat-pill{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:5px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.stat-pill b{font-size:17px;color:var(--gold)}
.stat-pill.bump{animation:bump .6s ease}
@keyframes bump{30%{transform:scale(1.18);background:rgba(227,178,60,.45)}}
.head-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff;border-radius:10px;
  padding:7px 12px;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.head-btn:hover{background:rgba(255,255,255,.2)}
.head-btn.gold{background:var(--gold);color:var(--teal);border-color:var(--gold)}
.head-btn.gold[disabled]{opacity:.55;cursor:not-allowed}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:370px 1fr;height:calc(100% - var(--head-h))}
aside{background:var(--cream);border-inline-end:1px solid var(--line);overflow-y:auto;padding:14px 14px 90px;scrollbar-width:thin}
#mapWrap{position:relative}
#map{position:absolute;inset:0;background:#cfe4ec}

.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(29,53,87,.05)}
.panel h2{margin:0 0 10px;font-size:15px;font-weight:800;color:var(--teal);display:flex;align-items:center;gap:8px}
.panel h2 .count{margin-inline-start:auto;font-size:12px;color:var(--muted);font-weight:700}

/* Category filter chips */
.cat-chips{display:grid;gap:8px}
.cat-chip{display:flex;align-items:center;gap:10px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);
  border-radius:12px;padding:7px 10px;font-weight:700;font-size:14px;color:var(--ink);text-align:start;transition:.2s}
.cat-chip .dot{width:30px;height:30px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:none}
.cat-chip .dot svg{width:18px;height:18px}
.cat-chip .n{margin-inline-start:auto;font-size:12px;background:#fff;border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.cat-chip[aria-pressed="false"]{border-color:#ddd;background:#f6f6f6;color:#999;filter:grayscale(1)}

/* Governorate ribbon */
.gov-ribbon{display:flex;flex-wrap:wrap;gap:6px}
.gov-chip{border:1px solid var(--line);background:var(--sand-l);color:var(--teal);border-radius:999px;padding:5px 11px;font-weight:700;font-size:13px;transition:.2s}
.gov-chip:hover{background:#ecd6b7}
.gov-chip.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.gov-chip .tick{color:var(--ok);font-weight:900}
.gov-chip.active .tick{color:var(--gold)}

/* Governorate showcase card */
.gov-card{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#fff;margin-bottom:12px;box-shadow:var(--shadow);animation:rise .35s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.gov-card .top{background:linear-gradient(135deg,var(--sand),#c08552);color:#fff;padding:12px 14px;position:relative}
.gov-card .top h3{margin:0;font-size:20px;font-weight:900}
.gov-card .top span{font-size:12px;font-weight:600;opacity:.9}
.gov-card .top .x{position:absolute;inset-inline-end:10px;top:10px;background:rgba(255,255,255,.25);border:0;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px}
.gov-row{display:flex;gap:10px;padding:9px 14px;border-top:1px solid #f1ebe1;font-size:13.5px;line-height:1.6}
.gov-row .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--sand-l)}
.gov-row b{display:block;color:var(--slate);font-size:12px}

/* Landmark list */
.lm-list{display:grid;gap:6px;max-height:300px;overflow:auto;padding-inline-end:2px}
.lm-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;text-align:start;font-size:13px;font-weight:600;color:var(--ink)}
.lm-item:hover{border-color:var(--slate);background:#f6f9fc}
.lm-item .sw{width:10px;height:10px;border-radius:50%;flex:none}
.lm-item .st{margin-inline-start:auto;font-size:13px}

/* Badges */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.badge{border:1px dashed #d5c7b2;border-radius:12px;padding:8px;text-align:center;background:#fffdf9;position:relative}
.badge .em{font-size:28px;filter:grayscale(1) opacity(.45);transition:.3s;display:block}
.badge .nm{font-size:12.5px;font-weight:800;color:var(--muted);display:block;line-height:1.35}
.badge .pr{height:6px;background:#efe6d8;border-radius:9px;margin-top:6px;overflow:hidden}
.badge .pr i{display:block;height:100%;background:linear-gradient(90deg,var(--sand),var(--gold));border-radius:9px;transition:width .5s}
.badge .ct{font-size:11px;color:var(--muted);font-weight:700}
.badge.earned{border:2px solid var(--gold);background:linear-gradient(160deg,#fff8e6,#fff)}
.badge.earned .em{filter:none;animation:pop .6s ease}
.badge.earned .nm{color:var(--teal)}
@keyframes pop{40%{transform:scale(1.35) rotate(-8deg)}}

/* Tools */
.tool-row{display:flex;gap:8px;flex-wrap:wrap}
.tbtn{flex:1;min-width:120px;border:2px solid var(--slate);background:#fff;color:var(--teal);border-radius:12px;padding:8px 10px;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:6px}
.tbtn.on{background:var(--slate);color:#fff}
.tbtn.ghost{border-color:var(--line);color:var(--muted)}
.measure-out{margin-top:8px;font-size:13px;background:#f3f7fb;border-radius:10px;padding:8px 10px;color:var(--teal);font-weight:600;line-height:1.6}
.measure-out strong{font-size:20px;color:var(--modern)}
.basemaps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.basemaps label{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;background:#fff}
.basemaps input{accent-color:var(--teal)}
.note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.5}

/* ---------- Custom markers ---------- */
.om-pin{position:relative;width:36px;height:46px}
.om-pin svg.pin{position:relative;z-index:2;transition:transform .2s;transform-origin:50% 100%;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3))}
.om-pin:hover svg.pin,.om-pin.sel svg.pin{transform:scale(1.18) translateY(-2px)}
.om-pin .pulse{position:absolute;left:50%;bottom:-6px;width:26px;height:12px;margin-left:-13px;border-radius:50%;background:var(--c);opacity:0;z-index:1}
.om-pin.fresh .pulse{animation:pulse 2.2s ease-out infinite}
.om-pin:hover .pulse{animation:pulse 1s ease-out infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.75}100%{transform:scale(2.6);opacity:0}}
.om-pin .st{position:absolute;top:-6px;right:-6px;z-index:3;width:18px;height:18px;border-radius:50%;color:#fff;font:900 11px/18px 'Cairo';text-align:center;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.cap-pin{width:26px;height:26px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 3px var(--teal),0 4px 10px rgba(0,0,0,.3);display:grid;place-items:center;font-size:13px}
.measure-pt{width:16px;height:16px;border-radius:50%;background:var(--modern);border:3px solid #fff;box-shadow:0 0 0 2px var(--modern)}
.dist-label{background:var(--teal)!important;font-size:14px!important}

/* Offline basemap labels */
.map-label{white-space:nowrap;text-align:center;pointer-events:none;font-family:'Cairo';transform:translate(-50%,-50%);display:inline-block}
.map-label.sea{color:#3d7da3;font-style:italic;font-weight:700;font-size:15px;letter-spacing:.5px;opacity:.85}
.map-label.strait{color:#3d7da3;font-weight:700;font-size:12px}
.map-label.country{color:#8f8676;font-weight:800;font-size:14px;letter-spacing:1px;opacity:.85}
.map-label.desert{color:#b48a5a;font-weight:800;font-size:13px;opacity:.85}
.map-label.oman{color:var(--teal);font-weight:900;font-size:18px;opacity:.35}
.coords{background:rgba(255,255,255,.88);border-radius:8px;padding:3px 8px;font:700 12px 'Cairo';color:var(--teal);direction:ltr;box-shadow:0 1px 6px rgba(0,0,0,.12)}

/* ---------- Popup ---------- */
.pop{font-family:'Cairo',sans-serif}
.pop .band{padding:14px 16px 12px;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 65%,#1D3557));position:relative}
.pop .band .cat{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.2);border-radius:999px;padding:1px 10px;font-size:11.5px;font-weight:700}
.pop .band .cat svg{width:13px;height:13px}
.pop .band h3{margin:6px 0 0;font-size:19px;font-weight:900;line-height:1.3}
.pop .band .alt{font-size:12px;opacity:.85;font-weight:600}
.pop .body{padding:12px 14px 14px}
.pop .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pop .tag{background:var(--sand-l);color:#7a4f22;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:700}
.pop .tag.co{background:#eef4f9;color:var(--slate);direction:ltr}
.pop .fact{background:#fffaf0;border:1px solid #f1dfb8;border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.7;position:relative}
.pop .fact .lbl{display:flex;align-items:center;gap:6px;font-weight:800;color:#a8741a;font-size:12.5px;margin-bottom:2px}
.pop .speak{margin-inline-start:auto;border:0;background:#f6e7c6;color:#7a4f22;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800}
.pop .speak.on{background:var(--gold);color:var(--teal)}
.pop .go{margin-top:12px;width:100%;border:0;border-radius:12px;padding:10px;font-size:15px;font-weight:900;color:#fff;background:linear-gradient(135deg,var(--emerald),#137a53);box-shadow:0 4px 12px rgba(27,156,107,.35)}
.pop .go:hover{filter:brightness(1.08)}
.pop .go.done{background:linear-gradient(135deg,var(--slate),var(--teal));box-shadow:none}

/* ---------- Modals ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,28,46,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:3000;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:rise .3s ease}
.modal .mh{padding:16px 20px;color:#fff;background:linear-gradient(135deg,var(--c,var(--teal)),color-mix(in srgb,var(--c,var(--teal)) 60%,#0f1c2e));display:flex;align-items:center;gap:10px}
.modal .mh h3{margin:0;font-size:18px;font-weight:900}
.modal .mh small{display:block;font-size:12px;opacity:.85;font-weight:600}
.modal .mh .x{margin-inline-start:auto;border:0;background:rgba(255,255,255,.2);color:#fff;width:34px;height:34px;border-radius:50%;font-size:18px}
.modal .mb{padding:18px 20px 20px}
.q-text{font-size:19px;font-weight:800;line-height:1.6;margin:0 0 14px;color:var(--teal)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:16px;font-weight:700;color:var(--ink);transition:.15s}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sand-l);color:#7a4f22;font-weight:900}
.opt:hover:not([disabled]){border-color:var(--slate);transform:translateY(-1px);box-shadow:0 4px 12px rgba(69,123,157,.15)}
.opt[disabled]{cursor:default}
.opt.correct{border-color:var(--ok);background:#e8f7ef;color:#11663f}.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdecec;color:#9b2222}.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.feedback{margin-top:14px;border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px;display:none;line-height:1.6}
.feedback.show{display:block;animation:rise .3s}
.feedback.ok{background:#e8f7ef;color:#11663f;border:1px solid #bfe8d1}
.feedback.no{background:#fff4e5;color:#8a4b00;border:1px solid #f5d6a8}
.m-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;background:var(--teal);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.alt{background:var(--sand-l);color:var(--teal)}
.btn.gold{background:var(--gold);color:var(--teal)}
.btn.red{background:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.field{display:grid;gap:6px;margin-bottom:12px;font-weight:700;font-size:14px;color:var(--teal)}
.field input{border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:600 16px 'Cairo';color:var(--ink)}
#certCanvas{width:100%;height:auto;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);display:block}
.modal.wide{max-width:860px}

/* Toasts & confetti */
#toasts{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:4000;display:grid;gap:8px;pointer-events:none;width:min(92vw,440px)}
.toast{background:var(--teal);color:#fff;border-radius:14px;padding:10px 14px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;animation:toastIn .35s ease;border-inline-start:5px solid var(--gold)}
.toast .em{font-size:24px}
@keyframes toastIn{from{opacity:0;transform:translateY(-12px) scale(.96)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:3500}

/* Mobile drawer */
.fab{display:none}
@media (max-width:900px){
  :root{--head-h:58px}
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset-inline:0;bottom:0;top:auto;height:62vh;z-index:1050;border-radius:22px 22px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.2);
    transform:translateY(105%);transition:transform .35s ease;border:0;padding-top:24px}

/* ---------- 3.3 State + persistence (localStorage, fail-safe) ---------- */
const KEY = "omanGeoQuest.v1";
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(KEY, JSON.stringify(v)); } catch(e){} }
};
const saved = store.get() || {};
const S = {
  lang: saved.lang || "ar",
  answers: saved.answers || {},          // { om_01: {correct:true, choice:"..."} }
  badges: saved.badges || [],            // earned badge ids
  name: saved.name || "",
  certNotified: !!saved.certNotified,
  cats: { heritage:true, nature:true, modern:true },
  gov: null,                             // selected governorate (ar name) or null
  base: "offline",
  measuring: false, mPts: []
};
const persist = () => store.set({ lang:S.lang, answers:S.answers, badges:S.badges, name:S.name, certNotified:S.certNotified });
const t = (k, vars) => { let s = (T[S.lang][k] ?? k); if (vars) for (const v in vars) s = s.replace("{"+v+"}", vars[v]); return s; };
const L_ = (ar, en) => S.lang === "ar" ? ar : en;
const score = () => Object.values(S.answers).filter(a => a.correct).length * 10;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---------- 3.4 Map + basemaps ---------- */
if (!window.L) { document.getElementById("map").innerHTML = '<p style="padding:30px;font:700 16px Cairo">Leaflet failed to load. Check your connection.</p>'; return; }

const OMAN_BOUNDS = L.latLngBounds([16.4, 51.8], [26.6, 60.2]);
const map = L.map("map", { zoomControl:true, minZoom:5, maxZoom:17, worldCopyJump:false, attributionControl:true, zoomSnap:0.25 })
  .fitBounds(OMAN_BOUNDS, { padding:[10,10] });
map.setMaxBounds(L.latLngBounds([5, 35], [36, 72]));
L.control.scale({ metric:true, imperial:false, position:"bottomright" }).addTo(map);
map.attributionControl.setPrefix('<a href="https://leafletjs.com" target="_blank" rel="noopener">Leaflet</a>');

/* Offline vector basemap (always available) */
const offline = L.layerGroup();
// Graticule every 2° (supports latitude/longitude literacy)
for (let la = 12; la <= 30; la += 2) L.polyline([[la,36],[la,70]], { color:"#9fc2d4", weight:1, dashArray:"3 6", interactive:false }).addTo(offline);
for (let lo = 40; lo <= 66; lo += 2) L.polyline([[8,lo],[34,lo]], { color:"#9fc2d4", weight:1, dashArray:"3 6", interactive:false }).addTo(offline);
L.polygon(GEO.neighbours, { color:"#c9bfae", weight:1, fillColor:"#efe9df", fillOpacity:1, interactive:false }).addTo(offline);
L.polygon(GEO.iran, { color:"#c9bfae", weight:1, fillColor:"#efe9df", fillOpacity:1, interactive:false }).addTo(offline);
const omanStyle = { color:"#8a5a2b", weight:2, fillColor:"#ecd2ad", fillOpacity:1, interactive:false };
[GEO.omanMain, GEO.musandam, GEO.masirah, GEO.daymaniyat].forEach(p => L.polygon(p, omanStyle).addTo(offline));
const labelLayer = L.layerGroup().addTo(offline);
function drawLabels(){
  labelLayer.clearLayers();
  GEO.labels.forEach(([la, lo, ar, en, kind]) => L.marker([la, lo], { interactive:false, keyboard:false,
    icon:L.divIcon({ className:"", html:`<span class="map-label ${kind}">${esc(L_(ar,en))}</span>`, iconSize:[0,0] }) }).addTo(labelLayer));
}
drawLabels();

const BASES = {
  offline: offline,
  topo: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { maxZoom:18,
    attribution:'Tiles &copy; Esri — Esri, HERE, Garmin, OpenStreetMap contributors' }),
  osm: L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }),
  sat: L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom:18,
    attribution:'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics' })
};
offline.addTo(map);

function setBase(key, silent){
  if (key === S.base) return;
  map.removeLayer(BASES[S.base]); S.base = key; BASES[key].addTo(map); BASES[key].bringToBack?.();
  renderBasemaps();
  if (key === "offline") return;
  // Watch for blocked tiles (e.g., sandboxed previews) and fall back gracefully
  let ok = 0, bad = 0; const layer = BASES[key];
  const onLoad = () => ok++, onErr = () => bad++;
  layer.on("tileload", onLoad).on("tileerror", onErr);
  setTimeout(() => {
    layer.off("tileload", onLoad).off("tileerror", onErr);
    if (S.base === key && ok === 0) { setBase("offline", true); if (!silent) toast("🗺️", t("tilesFail")); }
    else if (ok > 0 && !silent) toast("🛰️", t("tilesOk"));
  }, 3500);
}
/* Auto-upgrade to live tiles when they're reachable (local / GitHub Pages) */
(function probeTiles(){
  const img = new Image(); let done = false;
  img.onload = () => { if (!done) { done = true; setBase("osm", true); } };
  img.onerror = () => { done = true; };
  img.src = "https://tile.openstreetmap.org/5/21/13.png";
  setTimeout(() => { done = true; }, 4000);
})();

/* ---------- 3.5 Markers ---------- */

function govDone(g){ return LANDMARKS.some(l => l.governorate === g.ar && S.answers[l.id]); }

}

/* ---------- 3.10 Quiz engine ---------- */
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function openQuiz(id){
  const l = LANDMARKS.find(x => x.id === id), a = S.answers[id];
  const ansIdx = l.quiz.options.indexOf(l.quiz.answer);
  const order = shuffle([0,1,2]);
  const q = L_(l.quiz.question, l.en.question), opts = S.lang === "ar" ? l.quiz.options : l.en.options;
  $("quizModal").style.setProperty("--c", CATS[l.cat].color);
  $("qTitle").textContent = t("quizTitle") + " · " + L_(l.name_ar, l.name_en);
  $("qSub").textContent = `${L_(l.gov.ar, l.gov.en)} — ${L_(l.wilayat, l.en.wilayat)}`;
  $("qText").textContent = q;
  $("qDone").textContent = t("done");
  const fb = $("qFb"); fb.className = "feedback"; fb.textContent = "";
  const keys = S.lang === "ar" ? ["أ","ب","ج"] : ["A","B","C"];
  $("qOpts").innerHTML = order.map((oi, k) => `<button class="opt" data-oi="${oi}"><span class="k">${keys[k]}</span><span>${esc(opts[oi])}</span></button>`).join("");
  const lock = (chosen) => {
    $("qOpts").querySelectorAll(".opt").forEach(b => { const oi = +b.dataset.oi; b.disabled = true;
      if (oi === ansIdx) b.classList.add("correct"); else if (oi === chosen) b.classList.add("wrong"); else b.classList.add("dim"); });
  };
  if (a) { // review mode
    lock(l.quiz.options.indexOf(a.choice));
    fb.className = "feedback show " + (a.correct ? "ok" : "no");
    fb.textContent = t("already") + " " + (a.correct ? "✅" : t("wrong") + opts[ansIdx]);
  } else {
    $("qOpts").onclick = e => {
      const b = e.target.closest(".opt"); if (!b || b.disabled) return;
      const chosen = +b.dataset.oi, ok = chosen === ansIdx;
      $("qOpts").onclick = null; lock(chosen);
      S.answers[id] = { correct:ok, choice:l.quiz.options[chosen], t:Date.now() };
      persist();
      fb.className = "feedback show " + (ok ? "ok" : "no");
      fb.textContent = ok ? t("correct") : t("wrong") + opts[ansIdx];
      chime(ok);
      if (ok) { confetti(90); $("scorePill").classList.remove("bump"); void $("scorePill").offsetWidth; $("scorePill").classList.add("bump"); }
      afterAnswer(id);
    };
  }
  openOv("quizOv");
}
function afterAnswer(id){
  refreshPin(id); updateStats(); renderGovs(); renderList(); checkBadges();
  if (openId === id) { const l = LANDMARKS.find(x => x.id === id); map.closePopup(); openPopup(l); }
  if (score() >= 100 && !S.certNotified) { S.certNotified = true; persist(); setTimeout(() => toast("🎓", t("certReady")), 900); }
}

/* ---------- 3.13 Read-aloud (Web Speech API) ---------- */
let speakingBtn = null;
function stopSpeech(){ try { speechSynthesis.cancel(); } catch(e){} if (speakingBtn) { speakingBtn.classList.remove("on"); speakingBtn.textContent = t("listen"); speakingBtn = null; } }
function toggleSpeech(text, btn){
  if (!("speechSynthesis" in window)) { toast("🔇", t("noSpeech")); return; }
  if (speakingBtn === btn) { stopSpeech(); return; }
  stopSpeech();
  const u = new SpeechSynthesisUtterance(text);
  const want = S.lang === "ar" ? "ar" : "en";
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith(want));
  u.lang = S.lang === "ar" ? (v?.lang || "ar-SA") : (v?.lang || "en-US"); if (v) u.voice = v;
  u.rate = S.lang === "ar" ? 0.9 : 0.95;
  if (!v && want === "ar") toast("🔈", t("noArVoice"));
  u.onend = u.onerror = () => { if (speakingBtn === btn) stopSpeech(); };
  speakingBtn = btn; btn.classList.add("on"); btn.textContent = t("stop");
  speechSynthesis.speak(u);
}
if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }

/* ---------- 3.14 Distance tool (haversine) ---------- */
const measureLayer = L.layerGroup().addTo(map);
const haversine = (a, b) => { const R = 6371, r = Math.PI / 180, dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
let mLast = null;
function renderMeasure(){
  const out = $("measureOut");
  $("measureBtn").classList.toggle("on", S.measuring);
  map.getContainer().classList.toggle("leaflet-crosshair", S.measuring);
  if (mLast) { out.innerHTML = `${t("mRes")}<br><strong>${mLast.d.toLocaleString(S.lang === "ar" ? "ar-OM" : "en-US", { maximumFractionDigits:1 })} ${t("km")}</strong><br>${esc(t("fromTo", { a:mLast.a, b:mLast.b }))}`; return; }
  out.textContent = !S.measuring ? t("mIdle") : (S.mPts.length ? t("mOne") : t("mOn"));
}
function addMeasurePoint(ll, name){
  if (S.mPts.length >= 2) { measureLayer.clearLayers(); S.mPts = []; mLast = null; }
  S.mPts.push({ ll, name:name || `${t("point")} (${ll.lat.toFixed(2)}, ${ll.lng.toFixed(2)})` });
  L.marker(ll, { icon:L.divIcon({ className:"", html:'<div class="measure-pt"></div>', iconSize:[16,16], iconAnchor:[8,8] }), interactive:false }).addTo(measureLayer);
  if (S.mPts.length === 2) {
    const [p, q] = S.mPts, d = haversine(p.ll, q.ll);
    L.polyline([p.ll, q.ll], { color:"#1A8FC9", weight:4, dashArray:"10 8", interactive:false }).addTo(measureLayer);
    L.tooltip({ permanent:true, direction:"center", className:"dist-label" }).setLatLng([(p.ll.lat + q.ll.lat) / 2, (p.ll.lng + q.ll.lng) / 2])
      .setContent(`${d.toFixed(1)} ${t("km")}`).addTo(measureLayer);
    mLast = { d, a:p.name, b:q.name };
  }
  renderMeasure();
}
map.on("click", e => { if (S.measuring) addMeasurePoint(e.latlng); });
$("measureBtn").onclick = () => { S.measuring = !S.measuring; if (S.measuring) map.closePopup(); renderMeasure();
  if (S.measuring && window.innerWidth <= 900) $("side").classList.remove("open"); };
$("measureClear").onclick = () => { measureLayer.clearLayers(); S.mPts = []; mLast = null; renderMeasure(); };

/* ---------- 3.15 Basemap switcher ---------- */
function renderBasemaps(){
  $("basemaps").innerHTML = ["offline","osm","topo","sat"].map(k =>
    `<label><input type="radio" name="base" value="${k}" ${S.base === k ? "checked" : ""}> ${esc(t("base_" + k))}</label>`).join("");

/* ---------- 3.16 Overlays, toasts, sound ---------- */
function openOv(id){ $(id).classList.add("show"); }
function closeOv(id){ $(id).classList.remove("show"); }
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if (e.target === o) closeOv(o.id); }));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".overlay.show").forEach(o => closeOv(o.id)); });
function toast(em, msg){
  const d = document.createElement("div"); d.className = "toast"; d.innerHTML = `<span class="em">${em}</span><span>${esc(msg)}</span>`;
  const box=$("toasts"); box.appendChild(d); while(box.children.length>3) box.firstChild.remove(); setTimeout(() => { d.style.transition = "opacity .4s"; d.style.opacity = 0; setTimeout(() => d.remove(), 400); }, 3800);
}
let actx = null;
function chime(ok){
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [523.25, 659.25, 783.99] : [311.13, 261.63];
    notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = ok ? "triangle" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, actx.currentTime + i * 0.12); g.gain.exponentialRampToValueAtTime(0.18, actx.currentTime + i * 0.12 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + i * 0.12 + 0.3); o.connect(g).connect(actx.destination);
      o.start(actx.currentTime + i * 0.12); o.stop(actx.currentTime + i * 0.12 + 0.32); });
  } catch(e){}
}

/* ---------- 3.17 Confetti ---------- */
const cv = $("confetti"), cx = cv.getContext("2d"); let parts = [], raf = null;
function confetti(n){
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ["#E3B23C","#D4A373","#1B9C6B","#1A8FC9","#B9722E","#D64545","#fff"];
  for (let i = 0; i < n; i++) parts.push({ x:innerWidth / 2 + (Math.random() - .5) * 200, y:innerHeight * .35, vx:(Math.random() - .5) * 14, vy:-Math.random() * 13 - 4,
    s:Math.random() * 7 + 5, r:Math.random() * 6, vr:(Math.random() - .5) * .3, c:cols[i % cols.length], life:0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore(); });
  parts = parts.filter(p => p.y < cv.height + 20 && p.life < 260);
  raf = parts.length ? requestAnimationFrame(tick) : (cx.clearRect(0, 0, cv.width, cv.height), null);
}

/* ---------- 3.18 Certificate (Canvas, client-side) ---------- */
let DL = null; // platform downloads capability (only inside Claude artifacts)
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then(x => DL = x).catch(() => {}); } catch(e){}
const inFrame = (() => { try { return window.self !== window.top; } catch(e){ return true; } })();

function star(ctx, x, y, r, col){ ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r * .45 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } ctx.closePath(); ctx.fill(); ctx.restore(); }
async function drawCert(){
  const c = $("certCanvas"), x = c.getContext("2d"), W = c.width, H = c.height, ar = S.lang === "ar";
  try { await Promise.all([document.fonts.load("900 60px Cairo"), document.fonts.load("700 30px Cairo")]); } catch(e){}
  x.direction = ar ? "rtl" : "ltr"; x.textAlign = "center"; x.textBaseline = "middle";
  // background
  const bg = x.createLinearGradient(0, 0, W, H); bg.addColorStop(0, "#FFFBF3"); bg.addColorStop(1, "#F6EBDA"); x.fillStyle = bg; x.fillRect(0, 0, W, H);
  // sand-dune waves
  x.fillStyle = "rgba(212,163,115,.18)"; x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W; i += 20) x.lineTo(i, H - 120 - Math.sin(i / 140) * 40); x.lineTo(W, H); x.fill();
  x.fillStyle = "rgba(29,53,87,.06)"; x.beginPath(); x.moveTo(0, H); for (let i = 0; i <= W; i += 20) x.lineTo(i, H - 70 - Math.cos(i / 110) * 30); x.lineTo(W, H); x.fill();
  // borders
  x.lineWidth = 26; x.strokeStyle = "#1D3557"; x.strokeRect(13, 13, W - 26, H - 26);
  x.lineWidth = 4; x.strokeStyle = "#E3B23C"; x.strokeRect(46, 46, W - 92, H - 92);
  x.lineWidth = 1.5; x.strokeStyle = "#D4A373"; x.strokeRect(58, 58, W - 116, H - 116);
  [[58,58],[W-58,58],[58,H-58],[W-58,H-58]].forEach(([a, b]) => star(x, a, b, 30, "#E3B23C"));
  // seal
  x.save(); x.translate(W / 2, 150); star(x, 0, 0, 62, "#E3B23C"); x.beginPath(); x.arc(0, 0, 40, 0, 7); x.fillStyle = "#1D3557"; x.fill();
  x.font = "44px serif"; x.fillText("🧭", 0, 3); x.restore();
  // texts
  x.fillStyle = "#1D3557"; x.font = "900 66px Cairo"; x.fillText(t("certTitle"), W / 2, 270);
  x.fillStyle = "#B9722E"; x.font = "700 30px Cairo"; x.fillText(t("c_week") + " · " + (ar ? "Geography Awareness Week" : "أسبوع الوعي الجغرافي"), W / 2, 330);
  x.fillStyle = "#5f6f82"; x.font = "600 32px Cairo"; x.fillText(t("c_line1"), W / 2, 410);
  const nm = (S.name || "").trim() || t("explorer");
  x.fillStyle = "#b8862a"; x.font = "900 84px Cairo"; x.fillText(nm, W / 2, 505);
  x.strokeStyle = "#E3B23C"; x.lineWidth = 3; x.beginPath(); x.moveTo(W / 2 - 380, 565); x.lineTo(W / 2 + 380, 565); x.stroke();
  x.fillStyle = "#1d2a3a"; x.font = "600 30px Cairo";
  wrap(x, t("c_line2", { s:score(), e:Object.keys(S.answers).length }), W / 2, 625, 1150, 48);
  // badges row
  const bs = BADGES.filter(b => S.badges.includes(b.id));
  const show = bs.length ? bs : [];
  const gap = 260, start = W / 2 - (show.length - 1) * gap / 2;
  show.forEach((b, i) => { const bx = start + i * gap, by = 800;
    x.beginPath(); x.arc(bx, by, 58, 0, 7); x.fillStyle = "#fff"; x.fill(); x.lineWidth = 5; x.strokeStyle = "#E3B23C"; x.stroke();
    x.font = "54px serif"; x.fillStyle = "#000"; x.fillText(b.em, bx, by + 4);
    x.font = "800 24px Cairo"; x.fillStyle = "#1D3557"; x.fillText(t("b_" + b.id), bx, by + 92); });
  if (!show.length) { x.font = "700 64px Cairo"; x.fillStyle = "#E3B23C"; x.fillText("⭐ " + score() + " " + t("pts") + " ⭐", W / 2, 810); }
  // footer
  const d = new Date().toLocaleDateString(ar ? "ar-OM" : "en-GB", { year:"numeric", month:"long", day:"numeric" });
  x.font = "700 26px Cairo"; x.fillStyle = "#457B9D"; x.fillText(`${t("c_date")}: ${d}`, W / 2, 965);
  x.font = "800 26px Cairo"; x.fillStyle = "#1D3557"; x.fillText(t("c_foot"), W / 2, 1010);
}
function wrap(ctx, text, cx_, y, maxW, lh){
  const words = text.split(" "); let line = "", lines = [];
  words.forEach(w => { const test = line ? line + " " + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; });
  lines.push(line); lines.forEach((l, i) => ctx.fillText(l, cx_, y + i * lh));
}
$("certBtn").onclick = () => {
  if (score() < 100) { toast("🔒", t("certLocked", { n:100 - score() })); return; }
  $("certName").value = S.name; $("certPrint").style.display = inFrame ? "none" : "";
  $("certNote").textContent = inFrame ? t("printNote") : ""; openOv("certOv"); drawCert();
};
$("certName").addEventListener("input", e => { S.name = e.target.value; persist(); drawCert(); });
$("certSave").onclick = async () => {
  const blob = await new Promise(r => $("certCanvas").toBlob(r, "image/png"));
  if (DL) { try { await DL.save({ filename:"oman-explorer-certificate.png", data:blob }); toast("🎓", t("saved")); return; }
    catch(e){ if (e && e.code === "declined") return; } }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "oman-explorer-certificate.png";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    if (inFrame) setTimeout(() => toast("ℹ️", t("saveFail")), 600);
  } catch(e){ toast("⚠️", t("saveFail")); }
};
$("certPrint").onclick = () => { $("printImg").src = $("certCanvas").toDataURL("image/png"); setTimeout(() => window.print(), 150); };

/* ---------- 3.19 Reset ---------- */
$("resetBtn").onclick = () => openOv("resetOv");
$("resetYes").onclick = () => {

function applyLang(){
  document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === "ar" ? "rtl" : "ltr";
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));

  document.title = S.lang === "ar" ? "مستكشف عُمان الجغرافي | Oman Geographic Explorer" : "Oman Geographic Explorer | مستكشف عُمان الجغرافي";
  drawLabels(); setTooltips(); renderCats(); renderGovs(); renderGovCard(); renderBadges(); renderList(); renderMeasure(); renderBasemaps(); updateStats();
  if (capMarker && S.gov) { const g = GOVERNORATES.find(x => x.ar === S.gov); capMarker.setTooltipContent(`${t("capital")}: ${L_(g.cap_ar, g.cap_en)}`); }
  if (openId) openPopup(LANDMARKS.find(x => x.id === openId));
  if (mLast) { mLast = null; measureLayer.clearLayers(); S.mPts = []; renderMeasure(); }
}
$("langBtn").onclick = () => { stopSpeech(); S.lang = S.lang === "ar" ? "en" : "ar"; persist(); applyLang(); };

/* ---------- 3.21 Mobile drawer ---------- */
$("fab").onclick = () => $("side").classList.toggle("open");
map.on("click", () => { if (window.innerWidth <= 900 && !S.measuring) $("side").classList.remove("open"); });

/* ---------- 3.22 Boot ---------- */
applyLang(); applyFilters(); checkBadges();
setTimeout(() => toast("🧭", t("welcome")), 600);
window.addEventListener("resize", () => map.invalidateSize());
})();
